[project]
name = "lucidexis"
version = "0.1.0"
description = ""
requires-python = ">=3.13"
dependencies = [
    "aiofiles<26.0.0,>=24.1.0",
    "alembic<2.0.0,>=1.12.1",
    "bcrypt==4.0.1",
    "colorlog<7.0.0,>=6.8.0",
    "emails<1.0,>=0.6",
    "fastapi[standard]<1.0.0,>=0.114.2",
    "httpx<1.0.0,>=0.25.1",
    "jinja2<4.0.0,>=3.1.4",
    "passlib[bcrypt]<2.0.0,>=1.7.4",
    "psycopg[binary]<4.0.0,>=3.1.13",
    "pydantic>2.0",
    "pydantic-settings<3.0.0,>=2.2.1",
    "pyjwt<3.0.0,>=2.8.0",
    "pymupdf4llm<1,>=0.0.27",
    "semantic-text-splitter<1,>=0.28.0",
    "sqlmodel<1.0.0,>=0.0.21",
    "tenacity<9.0.0,>=8.2.3"
]

[dependency-groups]
dev = [
    "coverage >=7.10,<8",
    "factory_boy >=3.3.3,<4",
    "isort>=7.0.0",
    "mypy >=1.18.2,<2",
    "pre-commit >=4.3,<5",
    "pytest >=8.4.2,<9",
    "pytest-env >=1.1.5,<2",
    "pytest-factoryboy >=2.8.1,<3",
    "ruff >=0.13.2,<1",
    "types-aiofiles >=25.1.0,<26",
    "types-passlib >=1.7.7,<2"
]

[tool.mypy]
mypy_path=["src/"]
strict = true
exclude = ["venv", ".venv", "migrations", "email-templates", "scripts"]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "factory.*",
    "tests.factories.*",
]
no_implicit_reexport = false
disallow_untyped_calls = false


[tool.ruff]
target-version = "py313"
line-length = 88
exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pytest.ini_options]
pythonpath = "src"
filterwarnings = [
    "ignore::DeprecationWarning:importlib._bootstrap",
    "ignore:builtin type swigvarlink.*:DeprecationWarning",
]

[tool.pytest_env]
BCRYPT_ROUNDS = "4"
POSTGRES_DB = "testdb"


[tool.isort]
profile = "black"
